[project]
name = "antares-agent"
version = "0.1.0"
description = "A persistent coding agent, exposed over SSE"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.130",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# The relay is a separate process under a separate uid (D12), so the service
# never imports these -- they are here only so one `uv sync` builds both.
relay = [
    "aio-pika>=9.4",
    "httpx>=0.27",
]

[project.scripts]
antares-agent = "antares_agent.__main__:main"
antares-agent-relay = "antares_agent.relay:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antares_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# User-facing strings are Chinese; fullwidth punctuation is correct there.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
# the editable install goes through a .pth shim pyright cannot follow
extraPaths = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
